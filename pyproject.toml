[project]
name = "sgcorpus"
version = "0.1.0"
description = "Wiktextract → SQLite extraction pipeline for the Song Garden reference inspector"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Song Garden" }]
dependencies = [
    "zstandard>=0.22",
]

[project.scripts]
sgcorpus = "sgcorpus.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgcorpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
